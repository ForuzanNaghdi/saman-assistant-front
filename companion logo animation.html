<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>همیار هوش مصنوعی بیمه سامان</title>
<style>
  :root {
    --cp-bg: #0b1530;
    --cp-ribbon-1: #4a6eb1;
    --cp-ribbon-2: #264480;
    --cp-ribbon-3: #1a3160;
    --cp-accent: #ec3237;
    --cp-orbit: #264480;
    --cp-glow: #e8f0ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 48px;
    flex-wrap: wrap;
    background: radial-gradient(circle at 50% 40%, #16224a 0%, #0b1530 70%);
    font-family: 'Vazirmatn', 'Segoe UI', Tahoma, sans-serif;
    color: #e8f0ff;
    padding: 32px;
  }
  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 24px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(232,240,255,0.08);
    border-radius: 20px;
    backdrop-filter: blur(6px);
  }
  .card h2 {
    font-size: 15px;
    font-weight: 500;
    margin: 4px 0 0;
    opacity: 0.7;
  }
  .caption {
    font-size: 13px;
    opacity: 0.55;
    max-width: 220px;
    text-align: center;
    line-height: 1.7;
  }

  /* ===== Companion animations ===== */
  /* Pulse = one clean comet pass per loop.
     dasharray 18 182 -> pattern period 200 = 2x pathLength, so at most
     ONE dash instance can ever intersect the path: no wrap-around ghost.
     offset 22 -> -104 sweeps the dash from before the start to past the
     end (the 4-unit margins hide the round linecaps off-path), then
     holds invisible until the loop restarts. No opacity fades needed:
     entry and exit are purely geometric, so the loop is seamless. */
  .companion-pulse {
    stroke-dasharray: 18 182;
    stroke-dashoffset: 22;
    animation: cp-draw 4.2s cubic-bezier(0.42, 0, 0.58, 1) infinite;
  }
  @keyframes cp-draw {
    0%   { stroke-dashoffset: 22; }
    75%  { stroke-dashoffset: -104; }
    100% { stroke-dashoffset: -104; }
  }

  .companion-halo {
    transform-box: fill-box;
    transform-origin: center;
    animation: cp-halo 2.4s ease-in-out infinite;
  }
  @keyframes cp-halo {
    0%, 100% { transform: scale(1); opacity: 0.85; }
    50%      { transform: scale(1.55); opacity: 0.25; }
  }

  .companion-node {
    animation: cp-node 2.4s ease-in-out infinite;
  }
  @keyframes cp-node {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.18); }
  }

  .companion-orbit {
    stroke-dasharray: 2 4;
    animation: cp-spin 18s linear infinite;
    transform-origin: 60px 59px;
  }
  @keyframes cp-spin {
    to { transform: rotate(360deg); }
  }

  /* ===== Version 2: "ghost" path + reactive node =====
     The S-path is rendered in #13203d, a color only ~2 brightness units
     above the background, so it is barely visible until the comet
     passes over it. The red node is invisible while the comet is en
     route and only lights up when the comet's head reaches the path
     end (p ~= 0.53), peaks when the comet is fully on the node
     (p ~= 0.56), then fades out gradually through the rest hold.
     All three animations share the same 4.2s loop so they stay synced.
  */
  .companion-react-halo,
  .companion-react-core {
    transform-box: fill-box;
    transform-origin: center;
    opacity: 0;
  }
  .companion-react-halo {
    animation: cp-react-halo 4.2s cubic-bezier(0.42, 0, 0.58, 1) infinite;
  }
  .companion-react-core {
    animation: cp-react-core 4.2s cubic-bezier(0.42, 0, 0.58, 1) infinite;
  }
  @keyframes cp-react-halo {
    0%, 50%   { opacity: 0;    transform: scale(0.5); }
    53%       { opacity: 0.55; transform: scale(1.0); }
    56%       { opacity: 0.95; transform: scale(1.65); }
    68%       { opacity: 0.55; transform: scale(1.25); }
    85%       { opacity: 0.10; transform: scale(1.0); }
    100%      { opacity: 0;    transform: scale(0.5); }
  }
  @keyframes cp-react-core {
    0%, 50%   { opacity: 0;    transform: scale(0.7); }
    53%       { opacity: 0.7;  transform: scale(1.0); }
    56%       { opacity: 1;    transform: scale(1.2); }
    68%       { opacity: 0.7;  transform: scale(1.1); }
    85%       { opacity: 0.12; transform: scale(1.0); }
    100%      { opacity: 0;    transform: scale(0.7); }
  }

  @media (prefers-reduced-motion: reduce) {
    .companion-pulse, .companion-halo, .companion-node, .companion-orbit,
    .companion-react-halo, .companion-react-core {
      animation: none;
    }
    .companion-react-core { opacity: 1; }
  }
</style>
</head>
<body>

  <!-- ===== Version 1: default Saman palette, ~156px ===== -->
  <div class="card">
    <svg width="156" height="156" viewBox="0 0 120 120" fill="none"
         class="companion hero-companion" role="img"
         aria-label="همیار هوش مصنوعی بیمه سامان">
      <defs>
        <linearGradient id="cp-ribbon" x1="80" y1="20" x2="40" y2="100"
                        gradientUnits="userSpaceOnUse">
          <stop offset="0%"  stop-color="#4a6eb1"></stop>
          <stop offset="55%" stop-color="#264480"></stop>
          <stop offset="100%" stop-color="#1a3160"></stop>
        </linearGradient>
        <filter id="cp-glow" x="-45%" y="-45%" width="190%" height="190%">
          <feGaussianBlur stdDeviation="2" result="blur"></feGaussianBlur>
          <feMerge>
            <feMergeNode in="blur"></feMergeNode>
            <feMergeNode in="SourceGraphic"></feMergeNode>
          </feMerge>
        </filter>
      </defs>

      <!-- orbit -->
      <!-- <circle class="companion-orbit" cx="60" cy="59" r="46"
              stroke="#264480" stroke-width="1.2"></circle> -->

      <!--
        TRUE letter S with 180° rotational symmetry about (60,60).
        Lower half bulges RIGHT (to ~80,75), upper half bulges LEFT (to ~40,45),
        crossing diagonally through center (60,60). Node sits on end (80,20).
      -->
      <!-- <path class="companion-ribbon"
            d="M 40 100 C 95 95, 85 65, 60 60 35 55, 25 25, 80 20"
            pathLength="100"
            stroke="url(#cp-ribbon)"
            stroke-width="7.5"
            stroke-linecap="round"
            stroke-linejoin="round"></path>

      <path class="companion-pulse"
            d="M 40 100 C 95 95, 85 65, 60 60 35 55, 25 25, 80 20"
            pathLength="100"
            stroke="#e8f0ff"
            stroke-width="7.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            filter="url(#cp-glow)"></path> -->

      <!-- node seated on the path's end point (80,20) -->
      <!-- <circle class="companion-halo" cx="80" cy="20" r="8" -->
              <!-- fill="#ec3237"
              style="transform-box: fill-box; transform-origin: center;"></circle>
      <circle class="companion-node" cx="80" cy="20" r="4.2"
              fill="#ec3237"
              style="transform-box: fill-box; transform-origin: center;"></circle>
    </svg>
    <h2>نسخه ۱ — پالت سامان</h2>
    <p class="caption">مسیر S با تقارن ۱۸۰ درجه حول مرکز، نقطه قرمز دقیقاً روی پایان مسیر.</p>
  </div> -->

  <!-- ===== Version 2: ghost S-path + reactive node, ~200px ===== -->
  <div class="card">
    <svg width="200" height="200" viewBox="0 0 120 120" fill="none"
         class="companion hero-companion" role="img"
         aria-label="همیار هوش مصنوعی بیمه سامان — نسخه‌ی شبح">
      <defs>
        <linearGradient id="cp-ribbon-2" x1="80" y1="20" x2="40" y2="100"
                        gradientUnits="userSpaceOnUse">
          <stop offset="0%"  stop-color="#e8f0ff"></stop>
          <stop offset="55%" stop-color="#a8c4ff"></stop>
          <stop offset="100%" stop-color="#5a7fd0"></stop>
        </linearGradient>
      </defs>

      <circle class="companion-orbit" cx="60" cy="59" r="46"
              stroke="#264480" stroke-width="1.2"></circle>

      <!-- ghost S-path: barely visible against the dark background.
           The comet riding on top is what reveals it. -->
      <path class="companion-ribbon"
            d="M 40 100 C 95 95, 85 65, 60 60 35 55, 25 25, 80 20"
            pathLength="100"
            stroke="#13203d"
            stroke-width="7.5"
            stroke-linecap="round"
            stroke-linejoin="round"></path>

      <path class="companion-pulse"
            d="M 40 100 C 95 95, 85 65, 60 60 35 55, 25 25, 80 20"
            pathLength="100"
            stroke="url(#cp-ribbon-2)"
            stroke-width="7.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            filter="url(#cp-glow)"></path>

      <!-- reactive node: hidden until the comet hits the end, then
           glow + fade. Both layers start invisible (opacity:0 in CSS). -->
      <circle class="companion-react-halo" cx="80" cy="20" r="11"
              fill="#ec3237"></circle>
      <circle class="companion-react-core" cx="80" cy="20" r="4.2"
              fill="#ec3237"></circle>
    </svg>
    <h2>نسخه ۲ — مسیر شبحی + گره واکنشی</h2>
    <p class="caption">مسیر S تقریباً هم‌رنگ پس‌زمینه است و فقط با عبور ستاره‌ی دنباله‌دار آشکار می‌شود؛ نقطه‌ی قرمز فقط موقع رسیدن ستاره به پایان روشن و سپس محو می‌شود.</p>
  </div>

</body>
</html>
